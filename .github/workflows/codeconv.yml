name: Code Coverage

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches:
        - master
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 2
          - uses: actions/setup-go@v5
            with:
              go-version: '1.25'
          - name: Run coverage
            run: go test -v ./... -race -coverprofile=coverage.out -covermode=atomic
    
          - name: Upload coverage reports to Codecov
            uses: codecov/codecov-action@v5
            with:
              files: ./coverage.out
              flags: unittests
              name: codecov-ddefrancesco
              exclude: |
                **/mocks/**
                **/tests/**
                **/hipparcos/**
                **/openngc/**
                **/multibuild/**
                **/models/**
                **/usb/**

            env:
              CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}



